name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile
      - name: Astro check
        run: bunx astro check
      - name: Markdownlint
        run: bunx markdownlint-cli2 "**/*.md" "#node_modules" "#dist" "#.astro"
      - name: Build
        run: bun run build
      - name: Link check (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          # `--root-dir` is required so root-relative hrefs (`/zh-cn/...`,
          # `/_astro/...`, `/favicon.svg`) resolve against the built `dist/`
          # tree instead of erroring with "provide a root dir".
          args: --offline --no-progress --verbose --root-dir "${{ github.workspace }}/dist" "dist/**/*.html"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
